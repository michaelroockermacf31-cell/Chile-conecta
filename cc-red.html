<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chile Conecta</title>
<link rel="icon" href="cc-icon-192.png">
<style>
:root{--p:#0039a6;--r:#d52b1e;--bg:#f2f4f7;--c:#fff;--t:#1d2430;--m:#667;--l:#dde}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--c:#1a212b;--t:#eef1f5;--m:#9aa5b4;--l:#2c3644;--p:#5a9de6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 system-ui,sans-serif;padding-bottom:76px}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--c);border-bottom:1px solid var(--l);position:sticky;top:0;z-index:5}
header img{height:36px;width:36px;border-radius:8px}header b{color:var(--p);font-size:1.2rem}
main{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:12px;margin:10px 0}
input,select,textarea{width:100%;min-height:46px;margin:5px 0;padding:9px;font:inherit;color:inherit;background:transparent;border:1.5px solid var(--l);border-radius:8px}
button,.b{min-height:44px;padding:0 14px;border:1.5px solid var(--p);border-radius:8px;background:var(--p);color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.s{background:transparent;color:var(--t);border-color:var(--l)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.who{display:flex;gap:10px;align-items:center}.who img,.ph{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--l)}
.m{color:var(--m);font-size:.85rem}.err{color:var(--r);font-weight:600;margin:6px 0}
.media{width:100%;max-height:420px;border-radius:10px;margin:8px 0;object-fit:cover}
nav{position:fixed;bottom:0;left:0;right:0;display:none;background:var(--c);border-top:1px solid var(--l)}
nav button{flex:1;border:0;border-radius:0;background:transparent;color:var(--m);min-height:60px}nav button.on{color:var(--p);border-top:3px solid var(--p)}
</style></head><body>
<header><img src="cc-icon-192.png" alt=""><b>Chile Conecta</b></header>
<main id="app"></main>
<nav><button data-v="feed" onclick="ir('feed')">🏠 Inicio</button><button data-v="pub" onclick="ir('pub')">✏️ Publicar</button><button data-v="perfil" onclick="ir('perfil')">👤 Perfil</button></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const db=window.supabase.createClient('https://hpghighabbuldsnnqkbn.supabase.co','sb_publishable_QmPh1XPv2vPWBQPS_ml1cQ_PqOha-n5');
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SCAM=/paga(r)? por adelantado|pago por adelantado|transferencia urgente|datos de (la )?tarjeta|western union|clave (de|del) banco|deposita primero|gana dinero f[aá]cil/i;
const DISC=/s[oó]lo (mujeres|hombres|chilenos)|no extranjeros|no casados|edad m[aá]xima/i;
const TIPOS={ofrezco_servicio:'🛠️ Ofrezco servicio',busco_trabajo:'🔎 Busco trabajo',ofrezco_trabajo:'📢 Ofrezco trabajo',conocimiento:'💡 Conocimiento',proyecto:'🏗️ Proyecto terminado'};
let S={user:null,me:null,view:'feed',posts:[],rat:{},tipo:'',mode:'login'};
const err=t=>{const e=$('.err');if(e)e.textContent=t};
const wa=n=>{let d=String(n||'').replace(/\D/g,'');if(d.length===9)d='56'+d;return /^569\d{8}$/.test(d)?d:null};
function checkTxt(t){if(SCAM.test(t))return'⚠️ Parece una estafa (pide pago adelantado o datos bancarios). Edítalo o bórralo: infringe las normas de Chile Conecta.';if(DISC.test(t))return'⚠️ Contiene discriminación y va contra la Ley 20.609 y las normas de Chile Conecta. Edítalo o bórralo.';return''}
function okFile(f,img){const ok=['image/jpeg','image/png','image/webp'].concat(img?[]:['video/mp4','video/webm']);if(!ok.includes(f.type)){err('Formato no permitido (JPG, PNG, WebP'+(img?'':', MP4 o WebM')+').');return false}if(f.size>15728640){err('El archivo supera 15 MB.');return false}return true}
async function subir(f){const ext=(f.name.split('.').pop()||'bin').toLowerCase(),path=S.user.id+'/'+Date.now()+'.'+ext;const {error}=await db.storage.from('medios').upload(path,f,{contentType:f.type});if(error)throw error;return db.storage.from('medios').getPublicUrl(path).data.publicUrl}
function dur(f){return new Promise(r=>{const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{URL.revokeObjectURL(v.src);r(v.duration)};v.onerror=()=>r(0);v.src=URL.createObjectURL(f)})}
async function cargarMe(){const {data}=await db.from('profiles').select('*').eq('id',S.user.id).single();S.me=data}
async function cargar(){const [p,r]=await Promise.all([db.from('posts').select('*,profiles(nombre,oficio,comuna,whatsapp,foto_url,verificado)').order('creado',{ascending:false}).limit(50),db.from('resumen_resenas').select('*')]);S.posts=p.data||[];S.rat={};(r.data||[]).forEach(x=>S.rat[x.perfil_id]=x)}
async function iniciar(){await cargarMe();S.view='feed';await cargar();render()}
const ir=async v=>{S.view=v;if(v==='feed')await cargar();render()};

function vAuth(){const g=S.mode==='reg';return `<div class="card"><h2>${g?'Crear cuenta':'Entrar'}</h2>
${g?`<input id="a-nom" placeholder="Nombre y apellido reales"><input id="a-ofi" placeholder="Oficio o profesión"><input id="a-com" placeholder="Comuna"><input id="a-wa" inputmode="tel" placeholder="WhatsApp (ej: 9 1234 5678)"><label class="m">Foto tuya (obligatoria, con tu cara visible)</label><input id="a-foto" type="file" accept="image/jpeg,image/png,image/webp">`:''}
<input id="a-mail" type="email" placeholder="Correo"><input id="a-pw" type="password" placeholder="Contraseña (mín. 6)">
<div class="err"></div><button onclick="${g?'registrar':'entrar'}()">${g?'Crear cuenta':'Entrar'}</button>
<p class="m" onclick="S.mode='${g?'login':'reg'}';render()" style="text-align:center;cursor:pointer">${g?'¿Ya tienes cuenta? Entrar':'¿Eres nuevo? Crear cuenta'}</p></div>
<p class="m">Normas: sin estafas, sin discriminación (Ley 20.609) y sin maltrato. Con 3 reportes un aviso se oculta solo.</p>`}
async function registrar(){const g=i=>$(i).value.trim(),f=$('#a-foto').files[0],n=g('#a-nom');
if(n.length<5||n.split(/\s+/).length<2)return err('Escribe tu nombre y apellido reales.');
if(!g('#a-ofi')||!g('#a-com'))return err('Completa oficio y comuna.');
if(!wa(g('#a-wa')))return err('WhatsApp no válido (ej: 9 1234 5678).');
if(!f)return err('La foto es obligatoria.');
if(!okFile(f,true))return;
const {data,error}=await db.auth.signUp({email:g('#a-mail'),password:$('#a-pw').value,options:{data:{nombre:n,oficio:g('#a-ofi'),comuna:g('#a-com'),whatsapp:wa(g('#a-wa'))}}});
if(error)return err(error.message);
if(!data.session)return err('Revisa tu correo para confirmar la cuenta.');
S.user=data.user;try{const url=await subir(f);await db.from('profiles').update({foto_url:url}).eq('id',S.user.id)}catch(e){alert('Cuenta creada, pero la foto falló: '+e.message+'. Súbela en Perfil.')}
await iniciar()}
async function entrar(){const {data,error}=await db.auth.signInWithPassword({email:$('#a-mail').value.trim(),password:$('#a-pw').value});if(error)return err('Correo o contraseña incorrectos.');S.user=data.user;await iniciar()}
async function salir(){await db.auth.signOut();S.user=S.me=null;render()}

function vFeed(){const L=S.posts.filter(p=>!S.tipo||p.tipo===S.tipo);
return `<select onchange="S.tipo=this.value;render()"><option value="">Todos los avisos</option>${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}"${S.tipo===k?' selected':''}>${v}</option>`).join('')}</select>`+(L.length?L.map(card).join(''):'<p class="m">Aún no hay publicaciones.</p>')}
function card(p){const a=p.profiles||{},r=S.rat[p.autor],w=wa(a.whatsapp),mio=p.autor===S.user.id;
return `<div class="card"><div class="who">${a.foto_url?`<img src="${esc(a.foto_url)}" alt="">`:'<div class="ph"></div>'}<div><b>${esc(a.nombre)}</b>${a.verificado?' ✔️':''}<div class="m">${esc(a.oficio||'')}${a.comuna?' · '+esc(a.comuna):''}</div><div class="m">${r?'★ '+r.promedio+' ('+r.total+')':'Sin reseñas'} · ${new Date(p.creado).toLocaleDateString('es-CL')}</div></div></div>
<p class="m" style="margin:8px 0 0">${TIPOS[p.tipo]||''}</p><h3 style="margin:2px 0">${esc(p.titulo)}</h3><div style="white-space:pre-wrap">${esc(p.texto)}</div>
${p.media_url?(p.media_tipo==='video'?`<video class="media" controls preload="metadata" src="${esc(p.media_url)}"></video>`:`<img class="media" loading="lazy" src="${esc(p.media_url)}" alt="">`):''}
<div class="row" style="margin-top:8px">${w&&!mio?`<a class="b" target="_blank" rel="noopener" href="https://wa.me/${w}?text=${encodeURIComponent('Hola '+a.nombre+', vi tu aviso "'+p.titulo+'" en Chile Conecta')}">💬 WhatsApp</a>`:''}${mio?`<button class="s" onclick="borrar(${p.id})">🗑️ Borrar</button>`:`<button class="s" onclick="calificar('${p.autor}')">⭐ Calificar</button><button class="s" onclick="reportar(${p.id})">🚩 Reportar</button>`}</div></div>`}
async function reportar(id){const m=prompt('¿Por qué reportas este aviso? (estafa, discriminación, contenido falso...)');if(!m)return;const {error}=await db.from('reportes').insert({post_id:id,motivo:m.slice(0,300)});alert(error?(error.code==='23505'?'Ya reportaste este aviso.':'No se pudo reportar: '+error.message):'Gracias. Con 3 reportes el aviso se oculta solo.');if(!error){await cargar();render()}}
async function calificar(id){const e=parseInt(prompt('¿Cuántas estrellas? (1 a 5)'));if(!(e>=1&&e<=5))return;const c=(prompt('Comentario (opcional)')||'').slice(0,500),w=checkTxt(c);if(w)return alert(w);const {error}=await db.from('resenas').insert({sobre:id,estrellas:e,comentario:c||null});alert(error?(error.code==='23505'?'Ya calificaste a esta persona.':'No se pudo: '+error.message):'¡Gracias por tu reseña!');if(!error){await cargar();render()}}
async function borrar(id){if(!confirm('¿Borrar tu aviso?'))return;await db.from('posts').delete().eq('id',id);await cargar();render()}

function vPub(){const m=S.me||{};if(!m.foto_url||!m.whatsapp||m.suspendido)return `<div class="card"><p>${m.suspendido?'Tu cuenta está suspendida por reportes.':'Para publicar completa tu perfil: foto y WhatsApp.'}</p></div>`;
return `<div class="card"><h2>Nueva publicación</h2><select id="p-tipo">${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><input id="p-tit" maxlength="100" placeholder="Título (ej: Gasfíter certificado)"><textarea id="p-txt" rows="5" maxlength="1000" placeholder="Describe tu trabajo, horarios, zona y precio referencial..."></textarea><input id="p-com" placeholder="Comuna" value="${esc(m.comuna||'')}"><label class="m">Foto o video corto (máx. 20 s y 15 MB)</label><input id="p-media" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm"><div class="err"></div><button onclick="publicar()">Publicar</button></div>`}
async function publicar(){const t=$('#p-tit').value.trim(),x=$('#p-txt').value.trim(),f=$('#p-media').files[0];
if(t.length<4||x.length<10)return err('Escribe un título (mín. 4 letras) y una descripción (mín. 10).');
const w=checkTxt(t+' '+x);if(w)return err(w);
let url=null,mt=null;
if(f){if(!okFile(f,false))return;mt=f.type.startsWith('video')?'video':'imagen';if(mt==='video'&&(await dur(f))>20.5)return err('El video dura más de 20 segundos.');err('Subiendo...');try{url=await subir(f)}catch(e){return err('No se pudo subir: '+e.message)}}
const {error}=await db.from('posts').insert({tipo:$('#p-tipo').value,titulo:t,texto:x,comuna:$('#p-com').value.trim()||null,media_url:url,media_tipo:mt});
if(error)return err(error.message.includes('check')?'⚠️ Tu texto infringe las normas de Chile Conecta. Edítalo o bórralo.':'No se pudo publicar: '+error.message);
S.view='feed';await cargar();render()}

function vPerfil(){const m=S.me||{},r=S.rat[S.user.id];return `<div class="card"><div class="who">${m.foto_url?`<img src="${esc(m.foto_url)}" alt="">`:'<div class="ph"></div>'}<div><b>${esc(m.nombre)}</b>${m.verificado?' ✔️':''}<div class="m">${r?'★ '+r.promedio+' ('+r.total+' reseñas)':'Sin reseñas aún'}</div></div></div></div>
<div class="card"><h3>Mi perfil</h3><input id="e-nom" value="${esc(m.nombre)}" placeholder="Nombre y apellido"><input id="e-ofi" value="${esc(m.oficio||'')}" placeholder="Oficio"><input id="e-com" value="${esc(m.comuna||'')}" placeholder="Comuna"><input id="e-wa" value="${esc(m.whatsapp||'')}" placeholder="WhatsApp"><textarea id="e-bio" rows="3" placeholder="Sobre mí">${esc(m.bio||'')}</textarea><label class="m">Cambiar foto</label><input id="e-foto" type="file" accept="image/jpeg,image/png,image/webp"><div class="err"></div><div class="row"><button onclick="guardar()">Guardar</button><button class="s" onclick="salir()">Salir</button></div></div>`}
async function guardar(){const g=i=>$(i).value.trim(),n=g('#e-nom');if(n.length<5||n.split(/\s+/).length<2)return err('Escribe nombre y apellido reales.');if(!wa(g('#e-wa')))return err('WhatsApp no válido.');
const u={nombre:n,oficio:g('#e-ofi'),comuna:g('#e-com'),whatsapp:wa(g('#e-wa')),bio:g('#e-bio')},f=$('#e-foto').files[0];
if(f){if(!okFile(f,true))return;try{u.foto_url=await subir(f)}catch(e){return err(e.message)}}
const {error}=await db.from('profiles').update(u).eq('id',S.user.id);if(error)return err(error.message);
await cargarMe();render();err('✅ Guardado')}

function render(){const a=$('#app'),nv=$('nav');if(!S.user){a.innerHTML=vAuth();nv.style.display='none';return}
nv.style.display='flex';a.innerHTML=S.view==='pub'?vPub():S.view==='perfil'?vPerfil():vFeed();
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view))}
(async()=>{const {data}=await db.auth.getSession();if(data.session){S.user=data.session.user;await iniciar()}else render()})();
</script></body></html>
