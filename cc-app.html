<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chile Conecta · RedJusta</title>
<meta name="theme-color" content="#004e92">
<link rel="manifest" href="cc-manifest.webmanifest">
<link rel="icon" href="cc-icon-192.png"><link rel="apple-touch-icon" href="cc-icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--az:#004e92;--az2:#0a66e0;--rj:#d32f2f;--bg:#f0f2f5;--ink:#1c1e21;--dim:#65676b;--ln:#dadde1;--ok:#1b7f3b}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:var(--bg);color:var(--ink);padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.hide{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:12px}
header{background:#fff;position:sticky;top:0;z-index:20;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px}
header img{height:40px;width:auto}
header b{font-size:1.15rem;color:var(--az)} header b i{color:var(--rj);font-style:normal}
header small{display:block;font-size:.68rem;color:var(--dim);margin-top:-2px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--ln);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:9px 2px 7px;font-size:.72rem;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:1.25rem} nav button.on{color:var(--az);font-weight:700;box-shadow:inset 0 3px 0 var(--az)}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.banner{background:#e6f4ea;border:1px solid #b7dfc1;color:#14532d;border-radius:10px;padding:10px 12px;font-size:.82rem;margin-bottom:12px}
.warn{background:#fff7e0;border:1px solid #f1d98a;color:#6b4e00}
h2{font-size:1.05rem;margin-bottom:8px} h3{font-size:.95rem;margin:10px 0 6px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--ln);border-radius:9px;font-size:16px;margin:5px 0;background:#fff}
textarea{min-height:90px;resize:vertical}
label{font-size:.8rem;color:var(--dim);font-weight:600}
.btn{border:0;border-radius:9px;padding:11px 14px;font-size:.92rem;font-weight:700;background:var(--az);color:#fff}
.btn.rj{background:var(--rj)} .btn.gh{background:#e4e6eb;color:var(--ink)} .btn.wa{background:#1fa855} .btn.full{width:100%;margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--ln);background:#fff;border-radius:99px;padding:6px 11px;font-size:.78rem;color:var(--ink)}
.chip.on{background:var(--az);color:#fff;border-color:var(--az)}
.tag{display:inline-block;background:#e8f0fb;color:var(--az);border-radius:99px;padding:3px 9px;font-size:.72rem;margin:2px 3px 0 0}
.tag.ej{background:#fff1d6;color:#8a5a00}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.ph{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.nm{font-weight:700;font-size:.92rem} .sb{font-size:.76rem;color:var(--dim)}
.txt{font-size:.94rem;line-height:1.45;white-space:normal;word-wrap:break-word}
.pimg{width:100%;border-radius:10px;margin-top:8px;max-height:380px;object-fit:cover}
.acts{display:flex;border-top:1px solid var(--ln);margin-top:10px;padding-top:6px}
.acts button{flex:1;background:none;border:0;font-size:.78rem;color:var(--dim);padding:7px 2px}
.acts button.on{color:var(--az);font-weight:700}
.cm{background:#f0f2f5;border-radius:10px;padding:7px 10px;margin:6px 0;font-size:.84rem}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;overflow:auto}
.sheet>div{background:var(--bg);max-width:640px;margin:0 auto;min-height:100%;padding:12px;padding-bottom:40px}
.cover{height:90px;background:linear-gradient(135deg,var(--az),var(--az2));border-radius:12px 12px 0 0;margin:-14px -14px 0}
.stats{display:flex;text-align:center;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);margin:12px 0;padding:8px 0}
.stats div{flex:1} .stats b{display:block;font-size:1.15rem}.stats small{color:var(--dim);font-size:.72rem}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:.84rem;z-index:99;max-width:90%;text-align:center}
.login{max-width:480px;margin:0 auto;padding:18px}
.login .logo{width:100%;max-width:340px;display:block;margin:6px auto 4px}
.small{font-size:.76rem;color:var(--dim);line-height:1.4}
.fab{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--rj);color:#fff;border:0;border-radius:99px;padding:13px 18px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.25)}
</style></head><body>

const SK=['Electricidad SEC','Gasfitería','Albañilería','Carpintería','Metalcon','Pintura','Soldadura','Techumbre','Cerámica y pisos','Climatización','Prevención de riesgos','Arquitectura','Ingeniería','Topografía','Maquinaria','Maestranza','Jardinería','Otro'];
const RG=['Arica y Parinacota','Tarapacá','Antofagasta','Atacama','Coquimbo','Valparaíso','Metropolitana','O’Higgins','Maule','Ñuble','Biobío','La Araucanía','Los Ríos','Los Lagos','Aysén','Magallanes'];
const TY={conocimiento:['💡','Conocimiento'],proyecto:['🏗️','Proyecto terminado'],busco:['🔎','Busco trabajo'],ofrezco:['📢','Ofrezco trabajo'],servicio:['🛠️','Ofrezco servicio']};
const JT=['busco','ofrezco','servicio'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const rid=()=>'i'+Math.random().toString(36).slice(2,9)+Date.now().toString(36);
let S=load(),mode='crono',fType='',fSkill='',fText='',fRegion='',jobF='',tmp={};
function seed(){const n=Date.now(),m=60000;
 const U=[{id:'d1',name:'Carlos Herrera',job:'Maestro constructor',skills:['Metalcon','Albañilería'],region:'Valparaíso',comuna:'Cartagena',bio:'Ampliaciones y obra gruesa.'},
 {id:'d2',name:'María González',job:'Gasfíter',skills:['Gasfitería'],region:'Valparaíso',comuna:'Valparaíso',bio:'Instalaciones de agua, gas y calefón.'},
 {id:'d3',name:'Pedro Rojas',job:'Electricista',skills:['Electricidad SEC'],region:'Metropolitana',comuna:'Maipú',bio:'Instalaciones eléctricas.'},
 {id:'d4',name:'Ana Torres',job:'Prevencionista de riesgos',skills:['Prevención de riesgos'],region:'Valparaíso',comuna:'San Antonio',bio:'Prevención en obra.'},
 {id:'d5',name:'Luis Soto',job:'Carpintero',skills:['Carpintería','Techumbre'],region:'Biobío',comuna:'Concepción',bio:'Muebles y techumbres.'}].map(u=>({...u,demo:1,conns:[],phone:''}));
 const P=[{id:'p1',uid:'d1',type:'conocimiento',text:'Acabo de terminar una ampliación de 48 m² en Metalcon. El mayor error que veo es no calcular bien los conectores a la cadena existente. ¿Alguien tiene un tip rápido para anclajes en hormigón antiguo?',ts:n-5*m},
 {id:'p2',uid:'d2',type:'servicio',text:'Ofrezco servicios de gasfitería en Valparaíso. Instalación de calefón y redes de agua fría y caliente. Trabajo garantizado.',ts:n-60*m},
 {id:'p3',uid:'d3',type:'busco',text:'Busco trabajo como electricista. Experiencia en instalaciones residenciales y tableros. Disponible esta semana.',ts:n-3*60*m},
 {id:'p4',uid:'d4',type:'conocimiento',text:'Recordatorio: una baranda de protección a la altura de la cadera no protege. Revisa altura, travesaño intermedio y rodapié antes de trabajar en altura.',ts:n-5*60*m},
 {id:'p5',uid:'d5',type:'ofrezco',text:'Necesito dos ayudantes para armar una techumbre en Concepción, 5 días de trabajo. Pago al día.',ts:n-9*60*m}].map(p=>({...p,likes:[],comments:[]}));
 return {meId:null,users:U,posts:P,recs:[],projects:[],hidden:[]};}
function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.users)return s;}catch(e){}return seed();}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){toast('No se pudo guardar: almacenamiento lleno');}}
const me=()=>S.users.find(u=>u.id===S.meId);
const user=id=>S.users.find(u=>u.id===id)||{name:'Usuario',skills:[],job:'',conns:[]};
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return'hace un instante';if(s<3600)return'hace '+Math.floor(s/60)+' min';if(s<86400)return'hace '+Math.floor(s/3600)+' h';return'hace '+Math.floor(s/86400)+' d';}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),2600);}
function col(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return`hsl(${h},45%,42%)`;}
function av(u,sz){sz=sz||40;return`<div class="av" style="width:${sz}px;height:${sz}px;background:${col(u.name||'x')};font-size:${sz*.4}px">${u.photo?`<img src="${esc(u.photo)}" alt="">`:esc((u.name||'?').trim()[0]||'?').toUpperCase()}</div>`;}
function waLink(ph,t){let n=String(ph||'').replace(/\D/g,'');if(n.length===9&&n[0]==='9')n='56'+n;return n?`https://wa.me/${n}?text=${encodeURIComponent(t||'')}`:'';}
function compress(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.65));};im.onerror=()=>toast('No se pudo leer la imagen');im.src=r.result;};r.readAsDataURL(file);}

/* ---------- formulario de perfil ---------- */
function formHtml(p,u){u=u||{};tmp[p]=(u.skills||[]).slice();
 return`<label>Nombre completo</label><input id="${p}-name" value="${esc(u.name||'')}" maxlength="60">
 <label>Oficio o profesión (ej: Gasfíter, Arquitecta)</label><input id="${p}-job" value="${esc(u.job||'')}" maxlength="60">
 <label>Habilidades (elige las que correspondan)</label><div class="chips">${SK.map(k=>`<button type="button" class="chip ${tmp[p].includes(k)?'on':''}" data-a="sk" data-p="${p}" data-v="${esc(k)}">${esc(k)}</button>`).join('')}</div>
 <label>Región</label><select id="${p}-reg">${RG.map(r=>`<option ${r===u.region?'selected':''}>${esc(r)}</option>`).join('')}</select>
 <label>Comuna</label><input id="${p}-com" value="${esc(u.comuna||'')}" maxlength="40">
 <label>WhatsApp (opcional, se muestra en tu perfil)</label><input id="${p}-ph" type="tel" inputmode="tel" value="${esc(u.phone||'')}" placeholder="9 1234 5678" maxlength="16">
 <label>Sobre ti (opcional)</label><textarea id="${p}-bio" maxlength="400">${esc(u.bio||'')}</textarea>`;}
function readForm(p){const g=i=>$('#'+p+'-'+i).value.trim();
 const o={name:g('name'),job:g('job'),skills:tmp[p].slice(),region:g('reg'),comuna:g('com'),phone:g('ph'),bio:g('bio')};
 if(o.name.length<3)return toast('Escribe tu nombre'),null;if(!o.job)return toast('Escribe tu oficio o profesión'),null;
 if(!o.skills.length)return toast('Elige al menos una habilidad'),null;if(!o.comuna)return toast('Escribe tu comuna'),null;return o;}

/* ---------- feed ---------- */
function score(p){const m=me(),a=user(p.uid);let s=0;(a.skills||[]).forEach(k=>{if((m.skills||[]).includes(k))s+=100;});if((m.conns||[]).includes(p.uid))s+=50;return s;}
function postCard(p){const u=user(p.uid),t=TY[p.type]||TY.conocimiento,liked=(p.likes||[]).includes(S.meId),cm=p.comments||[],open=tmp['c'+p.id];
 return`<div class="card" id="post-${p.id}"><div class="ph"><div data-a="prof" data-id="${esc(u.id)}">${av(u)}</div><div style="flex:1"><div class="nm" data-a="prof" data-id="${esc(u.id)}">${esc(u.name)} ${u.demo?'<span class="tag ej">Ejemplo</span>':''}</div><div class="sb">${esc(u.job)} · ${ago(p.ts)}</div></div><span class="tag">${t[0]} ${t[1]}</span></div>
 <div class="txt">${nl(p.text)}</div>${p.img?`<img class="pimg" src="${esc(p.img)}" alt="">`:''}
 <div class="acts"><button class="${liked?'on':''}" data-a="like" data-id="${p.id}">👍 ${(p.likes||[]).length||''} Recomendar</button><button data-a="cm" data-id="${p.id}">💬 ${cm.length||''} Comentar</button><button data-a="wasend" data-id="${p.id}">↗️ WhatsApp</button><button data-a="rep" data-id="${p.id}">⚑</button></div>
 ${open?`<div>${cm.map(c=>`<div class="cm"><b>${esc(user(c.uid).name)}</b> ${esc(c.text)}</div>`).join('')}<div class="row"><input id="ci-${p.id}" placeholder="Escribe un comentario" style="flex:1" maxlength="300"><button class="btn" data-a="csend" data-id="${p.id}">Enviar</button></div></div>`:''}</div>`;}
function renderHome(){let L=S.posts.filter(p=>!S.hidden.includes(p.id));
 if(fType)L=L.filter(p=>p.type===fType);
 L.sort((a,b)=>mode==='skill'?(score(b)-score(a))||(b.ts-a.ts):b.ts-a.ts);
 $('#v-home').innerHTML=`<div class="banner">✅ <b>Feed justo:</b> ordenado ${mode==='skill'?'por tus habilidades y luego por fecha':'por fecha, lo más nuevo primero'}. Sin posts patrocinados ni cuentas Premium.</div>
 <div class="chips"><button class="chip ${mode==='crono'?'on':''}" data-a="mode" data-v="crono">🕒 Más nuevo</button><button class="chip ${mode==='skill'?'on':''}" data-a="mode" data-v="skill">🎯 Para mi oficio</button></div>
 <div class="chips"><button class="chip ${!fType?'on':''}" data-a="ftype" data-v="">Todo</button>${Object.keys(TY).map(k=>`<button class="chip ${fType===k?'on':''}" data-a="ftype" data-v="${k}">${TY[k][0]} ${TY[k][1]}</button>`).join('')}</div>
 ${L.length?L.map(postCard).join(''):'<div class="card small">Aún no hay publicaciones aquí. ¡Sé el primero!</div>'}`;}

/* ---------- red ---------- */
function userCard(u){const ph=waLink(u.phone,'Hola '+u.name+', te encontré en Chile Conecta.'),nr=S.recs.filter(r=>r.to===u.id).length;
 return`<div class="card"><div class="ph"><div data-a="prof" data-id="${u.id}">${av(u,46)}</div><div style="flex:1"><div class="nm" data-a="prof" data-id="${u.id}">${esc(u.name)} ${u.demo?'<span class="tag ej">Ejemplo</span>':''}</div><div class="sb">${esc(u.job)} · ${esc(u.comuna)}, ${esc(u.region)}</div></div></div>
 <div>${(u.skills||[]).map(k=>`<span class="tag">${esc(k)}</span>`).join('')}</div>
 <div class="row" style="margin-top:8px"><span class="sb">⭐ ${nr} recomendaci${nr===1?'ón':'ones'}</span><span style="flex:1"></span><button class="btn gh" data-a="prof" data-id="${u.id}">Ver perfil</button>${ph?`<a class="btn wa" href="${ph}" target="_blank" rel="noopener" style="text-decoration:none">WhatsApp</a>`:''}</div></div>`;}
function renderRed(){const q=fText.toLowerCase();
 let L=S.users.filter(u=>u.id!==S.meId);
 if(fSkill)L=L.filter(u=>(u.skills||[]).includes(fSkill));if(fRegion)L=L.filter(u=>u.region===fRegion);
 if(q)L=L.filter(u=>(u.name+' '+u.job+' '+u.comuna+' '+(u.skills||[]).join(' ')).toLowerCase().includes(q));
 $('#v-red').innerHTML=`<div class="card"><h2>Encuentra profesionales y maestros</h2><input id="q" placeholder="Busca por nombre, oficio o comuna" value="${esc(fText)}">
 <select id="qreg"><option value="">Todo Chile</option>${RG.map(r=>`<option ${r===fRegion?'selected':''}>${esc(r)}</option>`).join('')}</select>
 <div class="chips"><button class="chip ${!fSkill?'on':''}" data-a="fsk" data-v="">Todos</button>${SK.map(k=>`<button class="chip ${fSkill===k?'on':''}" data-a="fsk" data-v="${esc(k)}">${esc(k)}</button>`).join('')}</div></div>
 <p class="small" style="margin:0 2px 8px">${L.length} resultado${L.length===1?'':'s'}. Ordenados por nombre, sin destacados pagados.</p>
 ${L.sort((a,b)=>a.name.localeCompare(b.name)).map(userCard).join('')||'<div class="card small">Nadie coincide con tu búsqueda todavía.</div>'}`;
 $('#q').oninput=e=>{fText=e.target.value;clearTimeout(renderRed.t);renderRed.t=setTimeout(()=>{renderRed();const i=$('#q');i.focus();i.setSelectionRange(fText.length,fText.length);},250);};
 $('#qreg').onchange=e=>{fRegion=e.target.value;renderRed();};}

/* ---------- empleos ---------- */
function renderJobs(){let L=S.posts.filter(p=>JT.includes(p.type)&&!S.hidden.includes(p.id));if(jobF)L=L.filter(p=>p.type===jobF);L.sort((a,b)=>b.ts-a.ts);
 $('#v-jobs').innerHTML=`<div class="card"><h2>Empleos y servicios</h2><p class="small">Ofertas, personas que buscan trabajo y servicios. Siempre por fecha.</p>
 <div class="chips"><button class="chip ${!jobF?'on':''}" data-a="jf" data-v="">Todo</button>${JT.map(k=>`<button class="chip ${jobF===k?'on':''}" data-a="jf" data-v="${k}">${TY[k][0]} ${TY[k][1]}</button>`).join('')}</div>
 <button class="btn rj full" data-a="compose" data-t="ofrezco">Publicar un empleo o servicio</button></div>${L.map(postCard).join('')||'<div class="card small">Todavía no hay publicaciones de empleo.</div>'}`;}

/* ---------- perfil ---------- */
function profileHtml(u,own){const nr=S.recs.filter(r=>r.to===u.id),pr=S.projects.filter(x=>x.uid===u.id),m=me(),con=new Set((u.conns||[]));S.users.forEach(x=>{if((x.conns||[]).includes(u.id))con.add(x.id);});
 const ph=waLink(u.phone,'Hola '+u.name+', te encontré en Chile Conecta.'),isCon=(m.conns||[]).includes(u.id);
 return`<div class="card"><div class="cover"></div><div style="margin-top:-34px;display:flex;justify-content:center"><div style="border:4px solid #fff;border-radius:50%">${av(u,76)}</div></div>
 <div style="text-align:center;margin-top:6px"><div class="nm" style="font-size:1.1rem">${esc(u.name)} ${u.demo?'<span class="tag ej">Ejemplo</span>':''}</div><div class="sb">${esc(u.job)}</div><div class="sb">📍 ${esc(u.comuna)}, ${esc(u.region)}</div><div style="margin-top:6px">${(u.skills||[]).map(k=>`<span class="tag">${esc(k)}</span>`).join('')}</div></div>
 <div class="stats"><div><b>${con.size}</b><small>Conexiones</small></div><div><b>${pr.length}</b><small>Proyectos</small></div><div><b>${nr.length}</b><small>Recomendaciones</small></div></div>
 ${u.bio?`<p class="txt">${nl(u.bio)}</p>`:''}
 <div class="row" style="margin-top:10px">${own?`<button class="btn" data-a="edit">Editar perfil</button><button class="btn gh" data-a="shareprof">Compartir mi perfil</button>`:`<button class="btn ${isCon?'gh':''}" data-a="conn" data-id="${u.id}">${isCon?'✓ Conectado':'Conectar'}</button>${ph?`<a class="btn wa" href="${ph}" target="_blank" rel="noopener" style="text-decoration:none">WhatsApp</a>`:''}<button class="btn gh" data-a="recf" data-id="${u.id}">⭐ Recomendar</button>`}</div></div>
 <div class="card"><h2>Portafolio</h2>${pr.map(x=>`<div style="margin-bottom:12px"><div class="nm">${esc(x.title)}</div><div class="txt sb" style="color:var(--ink)">${nl(x.desc)}</div>${x.img?`<img class="pimg" src="${esc(x.img)}" alt="">`:''}</div>`).join('')||'<p class="small">Aún no hay proyectos.</p>'}${own?'<button class="btn gh full" data-a="projf">+ Agregar proyecto</button>':''}</div>
 <div class="card"><h2>Recomendaciones</h2><p class="small">Escritas por otras personas. La plataforma no las verifica.</p>${nr.map(r=>`<div class="cm"><b>${esc(user(r.from).name)}</b> · <span class="tag">${esc(r.skill)}</span><br>${esc(r.text)}</div>`).join('')||'<p class="small" style="margin-top:6px">Aún no tiene recomendaciones.</p>'}</div>`;}
function renderMe(){$('#v-me').innerHTML=profileHtml(me(),true)+`<div class="card"><h2>Tus datos</h2><p class="small">Versión de prueba: la información vive solo en este teléfono, no se envía a ningún servidor.</p><div class="row" style="margin-top:8px"><button class="btn gh" data-a="rules">Reglas</button><button class="btn gh" data-a="delEj">Borrar ejemplos</button><button class="btn gh" data-a="exp">Exportar</button><button class="btn rj" data-a="wipe">Borrar todo</button></div></div>`;}

/* ---------- sheets ---------- */
function sheet(h){$('#sheetBody').innerHTML=`<div class="row" style="justify-content:flex-end;margin-bottom:8px"><button class="btn gh" data-a="close">✕ Cerrar</button></div>`+h;$('#sheet').classList.remove('hide');$('#sheet').scrollTop=0;}
function closeSheet(){$('#sheet').classList.add('hide');}
function rulesHtml(){return`<div class="card"><h2>Reglas de la comunidad</h2><div class="txt"><p>• Respeta a todas las personas. Sin insultos ni discriminación.</p><p>• Nada de estafas, falsos trabajos ni cobros por adelantado engañosos.</p><p>• No publiques datos personales de otras personas sin su permiso.</p><p>• Di la verdad sobre tu oficio y tus certificaciones. Una persona que dice ser instalador SEC debe tener la autorización vigente.</p><p>• Puedes denunciar con el botón ⚑ y la publicación se oculta para ti.</p><p>• Publicaciones que dañen a otros pueden ser eliminadas.</p></div></div>`;}
function composeSheet(t){tmp.img='';sheet(`<div class="card"><h2>Nueva publicación</h2><label>Tipo</label><select id="c-type">${Object.keys(TY).map(k=>`<option value="${k}" ${k===(t||'conocimiento')?'selected':''}>${TY[k][0]} ${TY[k][1]}</option>`).join('')}</select><label>Texto</label><textarea id="c-text" maxlength="1500" placeholder="Cuenta tu conocimiento, tu proyecto o lo que buscas"></textarea><label>Foto (opcional)</label><input id="c-img" type="file" accept="image/*"><div id="c-prev"></div><button class="btn full" data-a="pub">Publicar</button></div>`);
 $('#c-img').onchange=e=>{const f=e.target.files[0];if(f)compress(f,d=>{tmp.img=d;$('#c-prev').innerHTML=`<img class="pimg" src="${d}" alt="">`;});};}

/* ---------- acciones ---------- */
function tab(v){['home','red','jobs','me'].forEach(k=>$('#v-'+k).classList.toggle('hide',k!==v));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));({home:renderHome,red:renderRed,jobs:renderJobs,me:renderMe})[v]();window.scrollTo(0,0);}
const curTab=()=>(document.querySelector('nav button.on')||{dataset:{v:'home'}}).dataset.v;
function refresh(){tab(curTab());}
function openProf(id){const u=user(id);sheet(profileHtml(u,id===S.meId));}
function start(){if(me()){$('#v-login').classList.add('hide');$('#app').classList.remove('hide');tab('home');}else{$('#v-login').classList.remove('hide');$('#app').classList.add('hide');$('#o-form').innerHTML=formHtml('o');}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,d=el.dataset;
 if(a==='rules'){e.preventDefault();sheet(rulesHtml());}
 else if(a==='sk'){const arr=tmp[d.p],i=arr.indexOf(d.v);if(i<0)arr.push(d.v);else arr.splice(i,1);el.classList.toggle('on');}
 else if(a==='signup'){if(!$('#o-rules').checked)return toast('Debes aceptar las reglas');const o=readForm('o');if(!o)return;S.users.push({id:'u'+rid(),...o,conns:[]});S.meId=S.users[S.users.length-1].id;save();start();toast('¡Bienvenido a Chile Conecta!');}
 else if(a==='tab')tab(d.v);
 else if(a==='mode'){mode=d.v;renderHome();}
 else if(a==='ftype'){fType=d.v;renderHome();}
 else if(a==='fsk'){fSkill=d.v;renderRed();}
 else if(a==='jf'){jobF=d.v;renderJobs();}
 else if(a==='like'){const p=S.posts.find(x=>x.id===d.id),i=p.likes.indexOf(S.meId);if(i<0)p.likes.push(S.meId);else p.likes.splice(i,1);save();refresh();}
 else if(a==='cm'){tmp['c'+d.id]=!tmp['c'+d.id];refresh();}
 else if(a==='csend'){const t=$('#ci-'+d.id).value.trim();if(!t)return;S.posts.find(x=>x.id===d.id).comments.push({uid:S.meId,text:t,ts:Date.now()});save();refresh();}
 else if(a==='wasend'){const p=S.posts.find(x=>x.id===d.id),t=user(p.uid).name+': '+p.text.slice(0,200)+'\n'+location.href;if(navigator.share)navigator.share({text:t}).catch(()=>{});else window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');}
 else if(a==='rep'){if(confirm('¿Denunciar y ocultar esta publicación?')){S.hidden.push(d.id);save();refresh();toast('Publicación denunciada y oculta');}}
 else if(a==='prof')openProf(d.id);
 else if(a==='close')closeSheet();
 else if(a==='compose')composeSheet(d.t);
 else if(a==='pub'){const t=$('#c-text').value.trim();if(t.length<5)return toast('Escribe algo más');S.posts.unshift({id:'p'+rid(),uid:S.meId,type:$('#c-type').value,text:t,img:tmp.img||'',ts:Date.now(),likes:[],comments:[]});save();closeSheet();refresh();toast('Publicado');}
 else if(a==='conn'){const m=me(),i=(m.conns=m.conns||[]).indexOf(d.id);if(i<0)m.conns.push(d.id);else m.conns.splice(i,1);save();openProf(d.id);}
 else if(a==='recf'){const u=user(d.id);sheet(`<div class="card"><h2>Recomendar a ${esc(u.name)}</h2><p class="small">Recomienda solo si trabajaste con esta persona o conoces su trabajo.</p><label>Habilidad</label><select id="r-sk">${(u.skills||[]).map(k=>`<option>${esc(k)}</option>`).join('')}</select><label>Tu recomendación</label><textarea id="r-tx" maxlength="400" placeholder="Qué trabajo hizo y cómo fue"></textarea><button class="btn full" data-a="recs" data-id="${u.id}">Publicar recomendación</button></div>`);}
 else if(a==='recs'){if(d.id===S.meId)return toast('No puedes recomendarte a ti mismo');const t=$('#r-tx').value.trim();if(t.length<10)return toast('Cuenta un poco más');S.recs=S.recs.filter(r=>!(r.from===S.meId&&r.to===d.id));S.recs.push({id:rid(),from:S.meId,to:d.id,skill:$('#r-sk').value,text:t,ts:Date.now()});save();openProf(d.id);toast('Recomendación publicada');}
 else if(a==='edit'){sheet(`<div class="card"><h2>Editar perfil</h2>${formHtml('e',me())}<button class="btn full" data-a="esave">Guardar</button></div>`);}
 else if(a==='esave'){const o=readForm('e');if(!o)return;Object.assign(me(),o);save();closeSheet();refresh();toast('Perfil actualizado');}
 else if(a==='projf'){tmp.pimg='';sheet(`<div class="card"><h2>Nuevo proyecto</h2><label>Título</label><input id="pj-t" maxlength="80"><label>Descripción</label><textarea id="pj-d" maxlength="600"></textarea><label>Foto (opcional)</label><input id="pj-i" type="file" accept="image/*"><div id="pj-p"></div><button class="btn full" data-a="projs">Guardar proyecto</button></div>`);$('#pj-i').onchange=ev=>{const f=ev.target.files[0];if(f)compress(f,x=>{tmp.pimg=x;$('#pj-p').innerHTML=`<img class="pimg" src="${x}" alt="">`;});};}
 else if(a==='projs'){const t=$('#pj-t').value.trim();if(!t)return toast('Escribe un título');S.projects.push({id:rid(),uid:S.meId,title:t,desc:$('#pj-d').value.trim(),img:tmp.pimg||'',ts:Date.now()});save();closeSheet();refresh();}
 else if(a==='shareprof'){const m=me(),t=`${m.name}, ${m.job} (${m.comuna}). Encuéntrame en Chile Conecta: ${location.href}`;if(navigator.share)navigator.share({text:t}).catch(()=>{});else window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');}
 else if(a==='delEj'){S.users=S.users.filter(u=>!u.demo);const ids=new Set(S.users.map(u=>u.id));S.posts=S.posts.filter(p=>ids.has(p.uid));S.recs=S.recs.filter(r=>ids.has(r.from)&&ids.has(r.to));save();refresh();toast('Ejemplos borrados');}
 else if(a==='exp'){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='chile-conecta-datos.json';l.click();}
 else if(a==='wipe'){if(confirm('¿Borrar todo y salir? No se puede deshacer.')){localStorage.removeItem(LS);S=seed();start();}}
});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('cc-sw.js').catch(()=>{}));
start();
</script></body></html>
